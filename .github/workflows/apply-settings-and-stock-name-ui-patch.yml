name: Apply settings and stock name UI patch

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_settings_and_stock_name_ui_patch.py'
      - '.github/workflows/apply-settings-and-stock-name-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-settings-and-stock-name-ui-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/apply_settings_and_stock_name_ui_patch.py
            git add \
              app/src/main/java/com/cryptotradecoach/MainActivity.kt \
              app/src/main/java/com/cryptotradecoach/MyStocksActivity.kt \
              app/src/main/java/com/cryptotradecoach/RecommendationHistoryActivity.kt
            if git diff --cached --quiet; then
              echo "Target UI patch is already applied."
              exit 0
            fi
            git commit -m "Separate global settings and resolve stock names in UI"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying attempt $attempt."
          done
          exit 1
